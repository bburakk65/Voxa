<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Voxa</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#090b12;
    color:#fff;
    min-height:100vh;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
    display:flex;
    background:
        radial-gradient(circle at 20% 10%,rgba(90,80,255,.13),transparent 30%),
        radial-gradient(circle at 80% 90%,rgba(0,220,255,.08),transparent 30%),
        #090b12;
}

/* SIDEBAR */

.sidebar{
    width:76px;
    background:rgba(12,14,23,.92);
    border-right:1px solid rgba(255,255,255,.07);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 10px;
    gap:12px;
    backdrop-filter:blur(20px);
}

.logo{
    width:48px;
    height:48px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:900;
    background:linear-gradient(135deg,#665cff,#00d4ff);
    box-shadow:0 8px 30px rgba(72,92,255,.3);
    margin-bottom:8px;
}

.server{
    width:48px;
    height:48px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.06);
    background:#151927;
    color:#aeb4c7;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.server:hover,
.server.active{
    background:linear-gradient(135deg,#665cff,#4658ff);
    color:white;
    transform:translateY(-2px);
}

.server.add{
    border:1px dashed #555d75;
    background:transparent;
    font-size:23px;
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    border-bottom:1px solid rgba(255,255,255,.07);
    background:rgba(10,12,20,.72);
    backdrop-filter:blur(18px);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand h1{
    font-size:20px;
}

.brand span{
    color:#7f879c;
    font-size:13px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:12px;
    background:#151927;
    color:#b8bfd1;
}

.icon-btn:hover{
    background:#202538;
    color:white;
}

.profile{
    display:flex;
    align-items:center;
    gap:9px;
    background:#151927;
    padding:6px 10px 6px 6px;
    border-radius:14px;
}

.avatar{
    width:32px;
    height:32px;
    border-radius:11px;
    background:linear-gradient(135deg,#8b5cf6,#06b6d4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.profile small{
    color:#8991a6;
}

/* CONTENT */

.content{
    padding:25px;
    overflow:auto;
}

.welcome{
    margin-bottom:22px;
}

.welcome h2{
    font-size:28px;
    margin-bottom:7px;
}

.welcome p{
    color:#858da1;
}

/* FRIENDS */

.grid{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:18px;
}

.card{
    background:rgba(17,20,31,.82);
    border:1px solid rgba(255,255,255,.07);
    border-radius:20px;
    padding:20px;
    box-shadow:0 15px 50px rgba(0,0,0,.15);
}

.card-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.card-title h3{
    font-size:16px;
}

.card-title span{
    font-size:12px;
    color:#737c92;
}

.friend{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px;
    border-radius:14px;
    transition:.2s;
}

.friend:hover{
    background:#181c2a;
}

.friend-left{
    display:flex;
    align-items:center;
    gap:11px;
}

.friend-avatar{
    width:42px;
    height:42px;
    border-radius:14px;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.status{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#37e58b;
    display:inline-block;
    margin-right:5px;
}

.friend-name{
    font-weight:600;
}

.friend-state{
    color:#7d879b;
    font-size:12px;
    margin-top:3px;
}

.chat-btn{
    border:0;
    padding:8px 12px;
    border-radius:10px;
    color:#fff;
    background:#242a3d;
}

.chat-btn:hover{
    background:#4d56e8;
}

/* QUICK */

.quick{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.quick button{
    min-height:95px;
    border:1px solid rgba(255,255,255,.06);
    border-radius:15px;
    background:#141824;
    color:#fff;
    text-align:left;
    padding:15px;
    transition:.2s;
}

.quick button:hover{
    background:#1b2030;
    transform:translateY(-2px);
}

.quick b{
    display:block;
    margin-bottom:6px;
}

.quick span{
    font-size:12px;
    color:#788197;
}

/* FRIEND ADD */

.add-friend{
    display:flex;
    gap:9px;
    margin-top:16px;
}

.add-friend input{
    flex:1;
    min-width:0;
    background:#0d1019;
    border:1px solid #292f40;
    color:#fff;
    border-radius:12px;
    padding:11px 13px;
    outline:none;
}

.add-friend input:focus{
    border-color:#626cff;
}

.primary{
    border:0;
    color:#fff;
    padding:0 15px;
    border-radius:12px;
    background:linear-gradient(135deg,#625cff,#4d75ff);
    font-weight:700;
}

.primary:hover{
    filter:brightness(1.1);
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    backdrop-filter:blur(7px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(430px,100%);
    background:#151925;
    border:1px solid rgba(255,255,255,.09);
    border-radius:22px;
    padding:23px;
    box-shadow:0 30px 100px rgba(0,0,0,.5);
    animation:pop .2s ease;
}

@keyframes pop{
    from{
        opacity:0;
        transform:scale(.94);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.close{
    width:34px;
    height:34px;
    border:0;
    border-radius:10px;
    background:#242838;
    color:#fff;
}

/* MOBILE */

@media(max-width:800px){

    .sidebar{
        width:62px;
        padding:12px 7px;
    }

    .server,
    .logo{
        width:42px;
        height:42px;
    }

    .content{
        padding:17px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .topbar{
        padding:0 14px;
    }

    .brand span{
        display:none;
    }

    .profile small{
        display:none;
    }
}

@media(max-width:480px){

    .sidebar{
        display:none;
    }

    .welcome h2{
        font-size:23px;
    }

    .content{
        padding:14px;
    }

    .quick{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">V</div>

        <button class="server active" title="Ana Sayfa">⌂</button>
        <button class="server" title="Sunucu">💬</button>
        <button class="server" title="Oyun">🎮</button>
        <button class="server" title="Topluluk">🌐</button>

        <button class="server add" onclick="openModal('serverModal')" title="Sunucu Ekle">
            +
        </button>

    </aside>

    <main class="main">

        <header class="topbar">

            <div class="brand">
                <h1>Voxa</h1>
                <span>Arkadaşlarınla bağlantıda kal</span>
            </div>

            <div class="top-actions">

                <button class="icon-btn" onclick="showMessage('Bildirimler açıldı')">
                    🔔
                </button>

                <button class="icon-btn" onclick="showMessage('Ayarlar')">
                    ⚙
                </button>

                <div class="profile">
                    <div class="avatar">B</div>
                    <div>
                        <b>Burak</b>
                        <small> çevrimiçi</small>
                    </div>
                </div>

            </div>

        </header>

        <section class="content">

            <div class="welcome">
                <h2>Tekrar hoş geldin 👋</h2>
                <p>Arkadaşlarınla konuş, sunuculara katıl ve birlikte eğlen.</p>
            </div>

            <div class="grid">

                <div class="card">

                    <div class="card-title">
                        <h3>Arkadaşlarım</h3>
                        <span>3 çevrimiçi</span>
                    </div>

                    <div class="friend">

                        <div class="friend-left">
                            <div class="friend-avatar">A</div>

                            <div>
                                <div class="friend-name">Alex</div>
                                <div class="friend-state">
                                    <span class="status"></span>Çevrimiçi
                                </div>
                            </div>
                        </div>

                        <button class="chat-btn"
                                onclick="showMessage('Alex ile sohbet açılıyor...')">
                            Mesaj
                        </button>

                    </div>

                    <div class="friend">

                        <div class="friend-left">
                            <div class="friend-avatar">M</div>

                            <div>
                                <div class="friend-name">Mert</div>
                                <div class="friend-state">
                                    <span class="status"></span>Oyunda
                                </div>
                            </div>
                        </div>

                        <button class="chat-btn"
                                onclick="showMessage('Mert ile sohbet açılıyor...')">
                            Mesaj
                        </button>

                    </div>

                    <div class="friend">

                        <div class="friend-left">
                            <div class="friend-avatar">K</div>

                            <div>
                                <div class="friend-name">Kaan</div>
                                <div class="friend-state">
                                    <span class="status"></span>Çevrimiçi
                                </div>
                            </div>
                        </div>

                        <button class="chat-btn"
                                onclick="showMessage('Kaan ile sohbet açılıyor...')">
                            Mesaj
                        </button>

                    </div>

                    <div class="add-friend">

                        <input
                            id="friendInput"
                            placeholder="Kullanıcı adı veya ID..."
                        >

                        <button class="primary" onclick="addFriend()">
                            Arkadaş Ekle
                        </button>

                    </div>

                </div>


                <div class="card">

                    <div class="card-title">
                        <h3>Hızlı İşlemler</h3>
                        <span>Voxa</span>
                    </div>

                    <div class="quick">

                        <button onclick="showMessage('Arkadaşlar bölümü açılıyor...')">
                            <b>👥 Arkadaşlar</b>
                            <span>Arkadaşlarını yönet</span>
                        </button>

                        <button onclick="openModal('serverModal')">
                            <b>➕ Sunucu Ekle</b>
                            <span>Yeni bir sunucu oluştur</span>
                        </button>

                        <button onclick="showMessage('Mesajlar açılıyor...')">
                            <b>💬 Mesajlar</b>
                            <span>Özel mesajlarını görüntüle</span>
                        </button>

                        <button onclick="showMessage('Ayarlar açılıyor...')">
                            <b>⚙ Ayarlar</b>
                            <span>Hesabını özelleştir</span>
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- SERVER MODAL -->

<div class="modal" id="serverModal">

    <div class="modal-box">

        <div class="modal-head">
            <h3>Sunucu Oluştur</h3>

            <button class="close"
                    onclick="closeModal('serverModal')">
                ×
            </button>
        </div>

        <p style="color:#858da1;font-size:14px;margin-bottom:17px;">
            Voxa'da kendi topluluğunu oluştur.
        </p>

        <input
            id="serverName"
            placeholder="Sunucu adı"
            style="
                width:100%;
                padding:12px;
                border-radius:12px;
                border:1px solid #292f40;
                background:#0d1019;
                color:white;
                outline:none;
            "
        >

        <button
            class="primary"
            style="width:100%;height:45px;margin-top:12px;"
            onclick="createServer()"
        >
            Sunucu Oluştur
        </button>

    </div>

</div>


<script>

function openModal(id){
    document.getElementById(id).classList.add("show");
}

function closeModal(id){
    document.getElementById(id).classList.remove("show");
}

function showMessage(message){

    const old = document.getElementById("toast");

    if(old) old.remove();

    const toast = document.createElement("div");

    toast.id = "toast";

    toast.textContent = message;

    toast.style.cssText = `
        position:fixed;
        bottom:25px;
        left:50%;
        transform:translateX(-50%);
        background:#171b29;
        border:1px solid rgba(255,255,255,.1);
        color:white;
        padding:12px 17px;
        border-radius:13px;
        box-shadow:0 15px 40px rgba(0,0,0,.4);
        z-index:9999;
        animation:pop .2s ease;
        font-size:14px;
    `;

    document.body.appendChild(toast);

    setTimeout(()=>{
        toast.remove();
    },2200);
}

function addFriend(){

    const input = document.getElementById("friendInput");

    const value = input.value.trim();

    if(!value){
        showMessage("Lütfen kullanıcı adı veya ID gir.");
        return;
    }

    showMessage(value + " için arkadaşlık isteği gönderildi.");

    input.value = "";
}

function createServer(){

    const input = document.getElementById("serverName");

    const name = input.value.trim();

    if(!name){
        showMessage("Lütfen sunucu adı gir.");
        return;
    }

    closeModal("serverModal");

    showMessage(name + " sunucusu oluşturuldu.");

    input.value = "";
}


/* ESC */

document.addEventListener("keydown",function(e){

    if(e.key === "Escape"){

        document
            .querySelectorAll(".modal")
            .forEach(modal=>{
                modal.classList.remove("show");
            });

    }

});


/* MODAL DIŞINA TIKLAMA */

document.querySelectorAll(".modal").forEach(modal=>{

    modal.addEventListener("click",function(e){

        if(e.target === modal){
            modal.classList.remove("show");
        }

    });

});

</script>

</body>
</html>
