      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Simgeleri üret
        run: |
          pip install --quiet pillow
          ICON="$RUNNER_TEMP/icon-kaynak.png"
          SRC=$(find . -name 'icon-512.png' -not -path './android/*' -not -path './desktop/*' -not -path './.git/*' | head -1)
          if [ -n "$SRC" ]; then
            cp "$SRC" "$ICON"; echo "Simge depodan alındı: $SRC"
          elif curl -fsSL --retry 3 https://voxa.voxaweb.workers.dev/icon-512.png -o "$ICON" && python3 -c "from PIL import Image; Image.open('$ICON')"; then
            echo "Simge siteden indirildi"
          else
            rm -f "$ICON"; echo "Simge bulunamadı: varsayılan Voxa simgesi çizilecek"
          fi
          export ICON_SRC="$ICON"
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          path = os.environ.get('ICON_SRC', '')
          if path and os.path.exists(path):
              src = Image.open(path).convert('RGBA')
              print('kaynak simge kullanildi:', path)
          else:
              print('kaynak simge yok: varsayilan Voxa simgesi ciziliyor')
              src = Image.new('RGBA', (512, 512))
              sp = src.load()
              c1, c2 = (88, 101, 242), (236, 72, 153)
              for y in range(512):
                  for x in range(512):
                      t = (x + y) / 1022
                      sp[x, y] = tuple(int(c1[i] + (c2[i] - c1[i]) * t) for i in range(3)) + (255,)
              ImageDraw.Draw(src).polygon([(150, 148), (222, 148), (256, 300), (290, 148), (362, 148), (288, 372), (224, 372)], fill=(255, 255, 255, 255))
          if src.size != (512, 512):
              src = src.resize((512, 512), Image.LANCZOS)
          W, H = src.size
          tl = src.getpixel((4, 4))[:3]
          br = src.getpixel((W - 5, H - 5))[:3]
          mask = Image.new('L', (W, H), 0)
          px = src.load(); mp = mask.load()
          for y in range(H):
              for x in range(W):
                  r, g, b, a = px[x, y]
                  if r > 235 and g > 235 and b > 235:
                      mp[x, y] = 255
          v = mask.crop(mask.getbbox())
          def lerp(a, b, t):
              return tuple(int(a[i] + (b[i] - a[i]) * t) for i in range(3))
          def gradient(size):
              im = Image.new('RGB', (size, size)); p = im.load()
              for y in range(size):
                  for x in range(size):
                      p[x, y] = lerp(tl, br, (x + y) / (2 * (size - 1)))
              return im
          def vlayer(s, frac):
              out = Image.new('RGBA', (s, s), (0, 0, 0, 0))
              scale = int(s * frac) / max(v.size)
              vv = v.resize((max(1, int(v.size[0] * scale)), max(1, int(v.size[1] * scale))), Image.LANCZOS)
              white = Image.new('RGBA', vv.size, (255, 255, 255, 255)); white.putalpha(vv)
              out.paste(white, ((s - vv.size[0]) // 2, (s - vv.size[1]) // 2), white)
              return out
          for d, s in {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}.items():
              base = 'android/app/src/main/res/mipmap-' + d
              os.makedirs(base, exist_ok=True)
              gradient(s).save(base + '/ic_launcher_background.png')
              vlayer(s, 0.42).save(base + '/ic_launcher_foreground.png')
          os.makedirs('android/app/src/main/res/drawable-nodpi', exist_ok=True)
          vlayer(432, 0.36).save('android/app/src/main/res/drawable-nodpi/splash_icon.png')
          os.makedirs('desktop/build', exist_ok=True)
          src.save('desktop/build/icon.png')
          print('simgeler uretildi')
          PY

      - name: Depoya kaydet ve derlemeyi başlat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "voxa-bot"
          git config user.email "voxa-bot@users.noreply.github.com"
          git add -A
          git commit -m "Voxa Android ve masaüstü paketi eklendi" || echo "Değişiklik yok"
          git push origin HEAD:main
          gh workflow run voxa-yayin.yml --ref main || echo "Derleme dosyası (voxa-yayin.yml) henüz yok; eklenince derleme otomatik başlar."
